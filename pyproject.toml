[project]
name = "BotCore"
version = "1.9.2"
description = "BotCore"
readme = "README.md"
requires-python = ">=3.9, <4.0"
dependencies = [
    "aiohttp>=3.8.0",
    "aiofiles>=23.0.0",
    "websockets>=11.0.0",
]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = ["src.plugins.BotCore"]
plugin_dirs = ["src/plugins"]
builtin_plugins = ["echo", "single_session"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
